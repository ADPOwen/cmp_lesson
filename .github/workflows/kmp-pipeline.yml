name: Kotlin Multiplatform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android-desktop:
    name: Build & Test Android & Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Common & Desktop Tests
        run: ./gradlew :shared:testAndroidHostTest :shared:jvmTest

      - name: Build Android APK (Debug)
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Desktop Distribution (Linux .deb)
        run: ./gradlew :desktopApp:packageDeb

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Upload Desktop Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-package
          path: desktopApp/build/compose/binaries/main/deb/*.deb

  build-ios:
    name: Build & Test iOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # - name: Run iOS Unit Tests
      #   run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace --info

      - name: Build iOS App (Simulator Debug)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
